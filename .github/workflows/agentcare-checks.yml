# Official hackathon workflow (agentcare-build-challenge-2026) + project test suite.
# Source: https://careerapi-production.krishnaik.in/api/ci/hackathons/agentcare-build-challenge-2026/workflow.yml
#
# Requires repository secret: SUBMISSION_TOKEN
# (Settings → Secrets and variables → Actions → New repository secret)
name: AgentCare Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write # required — without this the OIDC env vars do not exist
  contents: read

# A newer push supersedes an older run. The server also rejects stale runs by run_id,
# but cancelling here saves runner minutes.
concurrency:
  group: agentcare-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Where the API actually lives. This is the only value that changes between environments.
  API_BASE: https://careerapi-production.krishnaik.in
  # Opaque identifier stamped into the OIDC token. NOT a URL that gets fetched, and NOT
  # environment-specific — the server accepts this exact string everywhere. Do not change it.
  OIDC_AUDIENCE: https://career.krishnaik.in
  HACKATHON: agentcare-build-challenge-2026

jobs:
  # Official submission checks — push only (reports to the hackathon dashboard).
  checks:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No extra dependencies: these checks use only the Python standard library.

      - name: Request GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ env.OIDC_AUDIENCE }}" \
            | jq -r '.value')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not get an OIDC token. Check 'permissions: id-token: write'."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Download checks
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SUBMISSION_TOKEN: ${{ secrets.SUBMISSION_TOKEN }}
        run: |
          # The script is served only to GitHub Actions, and only for the hackathon this
          # token is registered for. Print the server's reason on failure instead of a
          # bare exit code.
          HTTP=$(curl -sS -o checks.py -w '%{http_code}' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "X-Submission-Token: $SUBMISSION_TOKEN" \
            "$API_BASE/api/ci/hackathons/$HACKATHON/checks.py")
          if [ "$HTTP" != "200" ]; then
            echo "::error::Could not download checks (HTTP $HTTP): $(cat checks.py)"
            exit 1
          fi

      - name: Run checks
        env:
          WEBHOOK_URL: ${{ env.API_BASE }}/api/ci/report
          SUBMISSION_TOKEN: ${{ secrets.SUBMISSION_TOKEN }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python checks.py

  # Project suite (smoke + pytest + eval) — runs on push, PR, and manual dispatch.
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Import smoke tests
        run: |
          uv run python -c "import main; print('main OK', main.app.title)"
          uv run python -c "from core.config import get_settings; print(get_settings().app_name)"
          uv run python -c "from core import llm; print('llm factory OK', llm.get_llm.__name__)"

      - name: Run pytest
        run: uv run pytest tests/ -v --tb=short
        env:
          SMTP_DISABLED: "true"
          USE_LLM: "false"
          SECRET_KEY: "ci-test-secret"

      # Deterministic keyword/routing eval (no LLM keys required).
      # Fails the job if safety recall < 100% or routing accuracy < 80%.
      - name: Run eval harness
        run: uv run python evaluate.py --routing --safety
        env:
          SMTP_DISABLED: "true"
          USE_LLM: "false"
          SECRET_KEY: "ci-test-secret"

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: docs/eval_report.html
          if-no-files-found: warn
